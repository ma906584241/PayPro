    testOnBorrow: false
    testOnReturn: false
    testWhileIdle: true
    timeBetweenEvictionRunsMillis: 60000
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DB_URL:jdbc:mysql://81.71.9.142:27887/pay-test?useSSL=false&characterEncoding=utf-8&serverTimezone=GMT%2B8}
    username: ${DB_USERNAME:root}
    validationQuery: SELECT 1 FROM DUAL
  redis:
    database: ${REDIS_DB:1}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
