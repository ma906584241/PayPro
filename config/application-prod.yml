# ==========================================
# PayPro 生产环境配置
# 请根据实际情况修改下方配置后执行 ./install.sh
# ==========================================

# ---- Spring Mail 邮件发送配置（必改） ----
spring:
  mail:
    host: smtp.qq.com
    port: 465
    username: 906584241@qq.com
    password: ${MAIL_PASSWORD:}   # 授权码由 .env / 环境变量提供
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
            required: false
          ssl:
            enable: true
            checkserveridentity: true
            trust: "smtp.qq.com"
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

paypro:
  # ---- 必改项 ----
  # 站点访问地址（改为你的域名或服务器IP）
  site: ${SITE_URL:https://pay.aioperis.com}

  # ---- 支付宝配置 ----
  # 支付宝用户ID（用于收款）改成你自己的
  alipayUserId: xxxx
  # 支付宝自定义收款码链接 改成你自己的
  alipayCustomQrUrl: 'https://qr.alipay.com/fkx17142vbhec1amt6dta4e?0&T=58793-08-04 21:08:51'

  # ---- 站点信息 ----
  # 网站标题（浏览器标签栏） 可改可不改
  title: AI智为工坊
  # 首页标题 可改可不改
  indexTitle: AI智为工坊
  # 收款人姓名 改成你自己的
  name: AI智为工作室
  # 联系电话 可改可不改
  mobile: 'xxxxxx'

  # ---- 邮箱配置 ----
  email:
    # 接收通知的邮箱 改成你自己的
    receiver: 906584241@qq.com
    # 发件邮箱 改成你自己的
    sender: 906584241@qq.com
  # 支持邮箱（页面展示） 改成你自己的
  supportMail: contact@aioperis.com

  # ---- 限流配置 ----
  rateLimit:
    # IP访问间隔（分钟），防刷
    ipExpire: 1

  # ---- Token配置 ----
  token:
    # 加密密钥（务必修改为随机字符串）
    value: 1
    # Token过期天数
    expire: 14

  # ---- 开放API配置 ----
  openapi:
    # OPEN API签名密钥（务必修改）
    secret: your_openapi_secret_key_here

  # ---- 二维码配置 ----
  # 每个金额的二维码数量
  qrCodeNum: 2

  # ---- 减额匹配配置 ----
  decrement:
    # 是否启用减额匹配模式
    enabled: false
    # 最大减额槽位数 可改可不改
    maxCount: 2
    # 减额步长（元）可改可不改,改了要对应二维码金额
    step: 0.01

  # ---- 产品配置 ----
  # 所有产品在此定义，修改后重启生效
  products:
    - id: 1
      product-name: "实例产品,演示效果"
      money: "5.00"
      description: ""
      type: "CODE"
      extend: ""
      download-url: "https://www.baidu.com"
    # 更多产品模板：
    # - id: 2
    #   product-name: "游戏礼包"
    #   money: "10.00"
    #   description: "包含100金币+10钻石"
    #   type: "GAME"
    #   extend: ""
    #   download-url: ""

  # ---- 支付方式(一般不需要调整) ----
  payMethods:
    - id: 'alipay'
      name: '支付宝支付'
      description: '扫码付款，需填写订单标识'
      icon: '🔵'
      status: true
      allow-night: false
      use-local-qr-code: true
    - id: 'wechat'
      name: '微信支付'
      description: '扫码付款，需填写订单标识'
      icon: '🟢'
      status: true
      allow-night: true
      use-local-qr-code: true
